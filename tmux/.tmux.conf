# Use the user's shell for tmux panes, but do not force login-shell mode.
# This avoids repeatedly triggering login-only startup scripts in every pane.
set -g default-shell "${SHELL}"
set -g default-command "${SHELL}"

# Status marker: confirms this managed dotfiles tmux config is active.
set -ag status-right " #[fg=green]DOTFILES-TMUX✓#[default]"
